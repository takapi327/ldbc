<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP','Helvetica Neue',Arial,sans-serif">
  <rect width="960" height="460" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">FxRuntime のスレッドモデル(プラットフォーム別)</text>

  <!-- JVM -->
  <rect x="20" y="56" width="290" height="384" rx="12" fill="#eef4ff" stroke="#3b6bd6" stroke-width="2"/>
  <text x="165" y="86" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f3f8f">JVM(マルチスレッド)</text>
  <rect x="45" y="108" width="240" height="46" rx="6" fill="#ffffff" stroke="#3b6bd6"/>
  <text x="165" y="136" text-anchor="middle" font-size="13" fill="#1f3f8f">メインスレッド(実行ループ)</text>
  <rect x="45" y="168" width="240" height="46" rx="6" fill="#ffffff" stroke="#3b6bd6"/>
  <text x="165" y="196" text-anchor="middle" font-size="13" fill="#1f3f8f">fx-scheduler スレッド(タイマー)</text>
  <rect x="45" y="228" width="240" height="86" rx="6" fill="#ffffff" stroke="#3b6bd6"/>
  <text x="165" y="256" text-anchor="middle" font-size="13" fill="#1f3f8f">fx-blocking プール</text>
  <text x="165" y="278" text-anchor="middle" font-size="12" fill="#666">ブロッキング処理を</text>
  <text x="165" y="296" text-anchor="middle" font-size="12" fill="#666">複数スレッドで並行実行</text>
  <text x="165" y="352" text-anchor="middle" font-size="12.5" fill="#333">待ち時間中も</text>
  <text x="165" y="372" text-anchor="middle" font-size="12.5" fill="#333">メインは自由に動ける</text>
  <text x="165" y="410" text-anchor="middle" font-size="12" fill="#3b6bd6">Executors(標準ライブラリ)</text>

  <!-- JS -->
  <rect x="335" y="56" width="290" height="384" rx="12" fill="#fff6e9" stroke="#d98a1f" stroke-width="2"/>
  <text x="480" y="86" text-anchor="middle" font-size="19" font-weight="bold" fill="#9a5c00">JS(単一スレッド)</text>
  <rect x="360" y="108" width="240" height="150" rx="8" fill="#ffffff" stroke="#d98a1f"/>
  <text x="480" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a5c00">たった1つのスレッド</text>
  <text x="480" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a5c00">(イベントループ)</text>
  <circle cx="480" cy="205" r="34" fill="none" stroke="#d98a1f" stroke-width="3"/>
  <path d="M480 171 A34 34 0 0 1 510 220" fill="none" stroke="#d98a1f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="210" text-anchor="middle" font-size="12" fill="#9a5c00">ぐるぐる</text>
  <text x="480" y="288" text-anchor="middle" font-size="12.5" fill="#333">タイマーは setTimeout</text>
  <text x="480" y="310" text-anchor="middle" font-size="12.5" fill="#333">blocking は「その場」で実行</text>
  <text x="480" y="352" text-anchor="middle" font-size="12.5" fill="#c0392b">重い処理を直接やると</text>
  <text x="480" y="372" text-anchor="middle" font-size="12.5" fill="#c0392b">全体が止まる</text>
  <text x="480" y="410" text-anchor="middle" font-size="12" fill="#d98a1f">スレッド無し(Web/Node の性質)</text>

  <!-- Native -->
  <rect x="650" y="56" width="290" height="384" rx="12" fill="#eefaf0" stroke="#2e9e5b" stroke-width="2"/>
  <text x="795" y="86" text-anchor="middle" font-size="19" font-weight="bold" fill="#1c6e3d">Native(マルチスレッド)</text>
  <rect x="675" y="108" width="240" height="46" rx="6" fill="#ffffff" stroke="#2e9e5b"/>
  <text x="795" y="136" text-anchor="middle" font-size="13" fill="#1c6e3d">メインスレッド(実行ループ)</text>
  <rect x="675" y="168" width="240" height="60" rx="6" fill="#ffffff" stroke="#2e9e5b"/>
  <text x="795" y="192" text-anchor="middle" font-size="13" fill="#1c6e3d">生成したデーモンスレッド</text>
  <text x="795" y="212" text-anchor="middle" font-size="12" fill="#666">(sleep / blocking の都度)</text>
  <text x="795" y="270" text-anchor="middle" font-size="12.5" fill="#333">JVM と同じく</text>
  <text x="795" y="290" text-anchor="middle" font-size="12.5" fill="#333">別スレッドに逃がせる</text>
  <text x="795" y="330" text-anchor="middle" font-size="12" fill="#666">※ Scala Native 0.5 の</text>
  <text x="795" y="348" text-anchor="middle" font-size="12" fill="#666">マルチスレッド機能を使用</text>
  <text x="795" y="410" text-anchor="middle" font-size="12" fill="#2e9e5b">プールは未実装(将来最適化)</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#d98a1f"/>
    </marker>
  </defs>
</svg>
