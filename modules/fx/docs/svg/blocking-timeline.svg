<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP','Helvetica Neue',Arial,sans-serif">
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">blocking(重い同期処理)の違い — 時間の流れ →</text>

  <!-- JVM / Native -->
  <text x="30" y="78" font-size="17" font-weight="bold" fill="#1f3f8f">JVM / Native(別スレッドに逃がす)</text>

  <text x="30" y="112" font-size="13" fill="#333">メインスレッド</text>
  <rect x="150" y="98" width="760" height="26" rx="4" fill="#cfe6d3" stroke="#2e9e5b"/>
  <text x="530" y="116" text-anchor="middle" font-size="12.5" fill="#1c6e3d">ずっと動作中(他の処理を止めない)</text>

  <text x="30" y="158" font-size="13" fill="#333">別スレッド</text>
  <rect x="150" y="144" width="60" height="26" rx="4" fill="#eef4ff" stroke="#3b6bd6"/>
  <rect x="210" y="144" width="430" height="26" rx="4" fill="#f6c6c0" stroke="#c0392b"/>
  <text x="425" y="162" text-anchor="middle" font-size="12.5" fill="#7a241b">blocking 処理(重い・待つ)</text>
  <rect x="640" y="144" width="60" height="26" rx="4" fill="#eef4ff" stroke="#3b6bd6"/>
  <text x="670" y="162" text-anchor="middle" font-size="11" fill="#1f3f8f">完了→cb</text>
  <text x="150" y="196" font-size="12.5" fill="#2e9e5b">結果: メインは自由なので、他の接続・クエリを並行に処理できる ✔</text>

  <line x1="30" y1="222" x2="930" y2="222" stroke="#ddd" stroke-width="1"/>

  <!-- JS -->
  <text x="30" y="262" font-size="17" font-weight="bold" fill="#9a5c00">JS(スレッドが1本しかない → その場で実行)</text>

  <text x="30" y="298" font-size="13" fill="#333">唯一のスレッド</text>
  <rect x="150" y="284" width="60" height="26" rx="4" fill="#fdebc8" stroke="#d98a1f"/>
  <rect x="210" y="284" width="430" height="26" rx="4" fill="#f6c6c0" stroke="#c0392b"/>
  <text x="425" y="302" text-anchor="middle" font-size="12.5" fill="#7a241b">blocking 処理(この間ずっと占有)</text>
  <rect x="640" y="284" width="270" height="26" rx="4" fill="#fdebc8" stroke="#d98a1f"/>
  <text x="150" y="336" font-size="12.5" fill="#c0392b">結果: 実行中はイベントループが止まり、他の処理・タイマー・I/O がすべて待たされる ✘</text>
  <text x="150" y="360" font-size="12.5" fill="#333">→ だから JS では重い同期処理を避け、非同期(async / setTimeout)を使うのが基本</text>
  <text x="150" y="392" font-size="12" fill="#666">補足: ldbc の実 I/O は非同期(node の net)なので、通常この「占有」は起きない。blocking は最終手段。</text>
</svg>
