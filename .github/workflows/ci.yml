name: Continuous Integration

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']
    tags: [v*]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        scala: [3.3.8, 3.8.4]
        java: [corretto@17, corretto@21, corretto@25]
        project: [ldbcJS, ldbcNative, ldbcJVM]
        exclude:
          - scala: 3.8.4
            java: corretto@21
          - scala: 3.8.4
            java: corretto@25
          - project: ldbcJS
            java: corretto@21
          - project: ldbcJS
            java: corretto@25
          - project: ldbcNative
            java: corretto@21
          - project: ldbcNative
            java: corretto@25
          - os: ubuntu-24.04
            project: ldbcJVM
          - os: ubuntu-24.04
            project: ldbcJS
          - os: ubuntu-22.04
            project: ldbcNative
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (corretto@17)
        id: setup-java-corretto-17
        if: matrix.java == 'corretto@17'
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17
          cache: sbt

      - name: sbt update
        if: matrix.java == 'corretto@17' && steps.setup-java-corretto-17.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Setup Java (corretto@21)
        id: setup-java-corretto-21
        if: matrix.java == 'corretto@21'
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
          cache: sbt

      - name: sbt update
        if: matrix.java == 'corretto@21' && steps.setup-java-corretto-21.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Setup Java (corretto@25)
        id: setup-java-corretto-25
        if: matrix.java == 'corretto@25'
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'corretto@25' && steps.setup-java-corretto-25.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Start up MySQL on Docker
        run: docker compose up -d

      - name: Update Homebrew
        if: matrix.project == 'ldbcNative'
        run: /home/linuxbrew/.linuxbrew/bin/brew update

      - name: Install brew formulae (ubuntu)
        if: (matrix.project == 'ldbcNative') && startsWith(matrix.os, 'ubuntu')
        run: /home/linuxbrew/.linuxbrew/bin/brew install s2n

      - name: Check that workflows are up to date
        run: sbt githubWorkflowCheck

      - name: Check headers and formatting
        if: matrix.java == 'corretto@17' && matrix.os == 'ubuntu-22.04'
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' headerCheckAll scalafmtCheckAll 'project /' scalafmtSbtCheck

      - name: scalaJSLink
        if: matrix.project == 'ldbcJS'
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' Test/scalaJSLinkerResult

      - name: nativeLink
        if: matrix.project == 'ldbcNative'
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' Test/nativeLink

      - name: Test (MySQL 9.x)
        env:
          MYSQL_PORT: 13306
          MYSQL_VERSION: 9.6.0
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' test

      - name: Test (MySQL 8.x)
        env:
          MYSQL_PORT: 13307
          MYSQL_VERSION: 8.4.7
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' test

      - name: Check binary compatibility
        if: matrix.java == 'corretto@17' && matrix.os == 'ubuntu-22.04'
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' mimaReportBinaryIssues

      - name: Generate API documentation
        if: matrix.java == 'corretto@17' && matrix.os == 'ubuntu-22.04'
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' doc

      - name: Stop MySQL on Docker
        run: docker compose down

      - name: Make target directories
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v'))
        run: mkdir -p modules/future/.js/target modules/zio/.js/target modules/future/.jvm/target modules/cats-effect/.js/target modules/query-builder/.js/target modules/cats-effect/.native/target modules/codegen/native/target modules/jdbc-connector/.jvm/target modules/authentication-plugin/native/target modules/future/.native/target modules/query-builder/.native/target modules/codegen/jvm/target modules/query-builder/.jvm/target modules/dsl/.native/target modules/effect/.js/target modules/testkit/native/target modules/pool/native/target modules/connector/js/target modules/otel4s/.native/target modules/net/jvm/target modules/codegen/js/target modules/net/js/target modules/net/native/target modules/testkit/js/target modules/zio-interop/.jvm/target modules/core/.native/target modules/fx/native/target modules/zio-telemetry/.jvm/target modules/sql/.js/target modules/authentication-plugin/js/target modules/otel4s/.js/target modules/otel4s/.jvm/target modules/mysql/js/target modules/effect/.native/target modules/aws-authentication-plugin/jvm/target modules/statement/.native/target modules/core/.js/target modules/mysql/jvm/target modules/schema/.js/target modules/fx/js/target modules/sql/.native/target modules/testkit-munit/js/target modules/fx/jvm/target modules/zio-interop/.js/target modules/schema/.native/target modules/statement/.jvm/target modules/zio/.jvm/target modules/testkit-munit/jvm/target modules/core/.jvm/target modules/telemetry/.js/target modules/dsl/.js/target modules/pool/js/target modules/sql/.jvm/target modules/authentication-plugin/jvm/target modules/statement/.js/target modules/connector/native/target modules/connector/jvm/target modules/schema/.jvm/target plugin/target modules/telemetry/.native/target modules/zio/.native/target modules/telemetry/.jvm/target modules/aws-authentication-plugin/native/target modules/testkit/jvm/target modules/cats-effect/.jvm/target modules/mysql/native/target modules/pool/jvm/target modules/dsl/.jvm/target modules/effect/.jvm/target modules/aws-authentication-plugin/js/target modules/testkit-munit/native/target project/target

      - name: Compress target directories
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v'))
        run: tar cf targets.tar modules/future/.js/target modules/zio/.js/target modules/future/.jvm/target modules/cats-effect/.js/target modules/query-builder/.js/target modules/cats-effect/.native/target modules/codegen/native/target modules/jdbc-connector/.jvm/target modules/authentication-plugin/native/target modules/future/.native/target modules/query-builder/.native/target modules/codegen/jvm/target modules/query-builder/.jvm/target modules/dsl/.native/target modules/effect/.js/target modules/testkit/native/target modules/pool/native/target modules/connector/js/target modules/otel4s/.native/target modules/net/jvm/target modules/codegen/js/target modules/net/js/target modules/net/native/target modules/testkit/js/target modules/zio-interop/.jvm/target modules/core/.native/target modules/fx/native/target modules/zio-telemetry/.jvm/target modules/sql/.js/target modules/authentication-plugin/js/target modules/otel4s/.js/target modules/otel4s/.jvm/target modules/mysql/js/target modules/effect/.native/target modules/aws-authentication-plugin/jvm/target modules/statement/.native/target modules/core/.js/target modules/mysql/jvm/target modules/schema/.js/target modules/fx/js/target modules/sql/.native/target modules/testkit-munit/js/target modules/fx/jvm/target modules/zio-interop/.js/target modules/schema/.native/target modules/statement/.jvm/target modules/zio/.jvm/target modules/testkit-munit/jvm/target modules/core/.jvm/target modules/telemetry/.js/target modules/dsl/.js/target modules/pool/js/target modules/sql/.jvm/target modules/authentication-plugin/jvm/target modules/statement/.js/target modules/connector/native/target modules/connector/jvm/target modules/schema/.jvm/target plugin/target modules/telemetry/.native/target modules/zio/.native/target modules/telemetry/.jvm/target modules/aws-authentication-plugin/native/target modules/testkit/jvm/target modules/cats-effect/.jvm/target modules/mysql/native/target modules/pool/jvm/target modules/dsl/.jvm/target modules/effect/.jvm/target modules/aws-authentication-plugin/js/target modules/testkit-munit/native/target project/target

      - name: Upload target directories
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v5
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-${{ matrix.scala }}-${{ matrix.project }}
          path: targets.tar

  publish:
    name: Publish Artifacts
    needs: [build]
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [corretto@17]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (corretto@17)
        id: setup-java-corretto-17
        if: matrix.java == 'corretto@17'
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17
          cache: sbt

      - name: sbt update
        if: matrix.java == 'corretto@17' && steps.setup-java-corretto-17.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Setup Java (corretto@21)
        id: setup-java-corretto-21
        if: matrix.java == 'corretto@21'
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
          cache: sbt

      - name: sbt update
        if: matrix.java == 'corretto@21' && steps.setup-java-corretto-21.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Setup Java (corretto@25)
        id: setup-java-corretto-25
        if: matrix.java == 'corretto@25'
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'corretto@25' && steps.setup-java-corretto-25.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Download target directories (3.3.8, ldbcJS)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3.3.8-ldbcJS

      - name: Inflate target directories (3.3.8, ldbcJS)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (3.3.8, ldbcJVM)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3.3.8-ldbcJVM

      - name: Inflate target directories (3.3.8, ldbcJVM)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (3.8.4, ldbcJS)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3.8.4-ldbcJS

      - name: Inflate target directories (3.8.4, ldbcJS)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (3.8.4, ldbcJVM)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3.8.4-ldbcJVM

      - name: Inflate target directories (3.8.4, ldbcJVM)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Import signing key
        if: env.PGP_SECRET != '' && env.PGP_PASSPHRASE == ''
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: echo $PGP_SECRET | base64 -d -i - | gpg --import

      - name: Import signing key and strip passphrase
        if: env.PGP_SECRET != '' && env.PGP_PASSPHRASE != ''
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          echo "$PGP_SECRET" | base64 -d -i - > /tmp/signing-key.gpg
          echo "$PGP_PASSPHRASE" | gpg --pinentry-mode loopback --passphrase-fd 0 --import /tmp/signing-key.gpg
          (echo "$PGP_PASSPHRASE"; echo; echo) | gpg --command-fd 0 --pinentry-mode loopback --change-passphrase $(gpg --list-secret-keys --with-colons 2> /dev/null | grep '^sec:' | cut --delimiter ':' --fields 5 | tail -n 1)

      - name: Publish
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_CREDENTIAL_HOST: ${{ secrets.SONATYPE_CREDENTIAL_HOST }}
        run: sbt tlCiRelease

  dependency-submission:
    name: Submit Dependencies
    if: github.event.repository.fork == false && github.event_name != 'pull_request'
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [corretto@17]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (corretto@17)
        id: setup-java-corretto-17
        if: matrix.java == 'corretto@17'
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17
          cache: sbt

      - name: sbt update
        if: matrix.java == 'corretto@17' && steps.setup-java-corretto-17.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Setup Java (corretto@21)
        id: setup-java-corretto-21
        if: matrix.java == 'corretto@21'
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
          cache: sbt

      - name: sbt update
        if: matrix.java == 'corretto@21' && steps.setup-java-corretto-21.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Setup Java (corretto@25)
        id: setup-java-corretto-25
        if: matrix.java == 'corretto@25'
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'corretto@25' && steps.setup-java-corretto-25.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Submit Dependencies
        uses: scalacenter/sbt-dependency-submission@v2
        with:
          modules-ignore: ldbcjs_3 ldbcjs_3 testkit_3 otel_3 mcp-ldbc-document-server_sjs1_3 docs_3 docs_3 zio_3 ldbcnative_3 ldbcnative_3 ldbcjvm_3 ldbcjvm_3 hikaricp_3 tests_sjs1_3 tests_sjs1_3 http4s_3 aws-iam-auth_3 tests_3 tests_3 benchmark_3 benchmark_3 tests_native0.5_3 tests_native0.5_3
          configs-ignore: test scala-tool scala-doc-tool test-internal

  validate-steward:
    name: Validate Steward Config
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [temurin@17]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (fast)
        uses: actions/checkout@v6

      - name: Setup Java (temurin@17)
        id: setup-java-temurin-17
        if: matrix.java == 'temurin@17'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: coursier/setup-action@v1
        with:
          apps: scala-steward

      - run: scala-steward validate-repo-config .scala-steward.conf

  site:
    name: Generate Site
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [corretto@17]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (corretto@17)
        id: setup-java-corretto-17
        if: matrix.java == 'corretto@17'
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17
          cache: sbt

      - name: sbt update
        if: matrix.java == 'corretto@17' && steps.setup-java-corretto-17.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Setup Java (corretto@21)
        id: setup-java-corretto-21
        if: matrix.java == 'corretto@21'
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
          cache: sbt

      - name: sbt update
        if: matrix.java == 'corretto@21' && steps.setup-java-corretto-21.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Setup Java (corretto@25)
        id: setup-java-corretto-25
        if: matrix.java == 'corretto@25'
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'corretto@25' && steps.setup-java-corretto-25.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Generate site
        run: sbt docs/tlSite

      - name: Publish site
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/target/docs/site
          keep_files: true

      - name: Generate site (archive)
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        env:
          LDBC_DOCS_ARCHIVE: true
        run: sbt docs/tlSite

      - name: Publish site (archive)
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/target/docs/site/0.9
          destination_dir: 0.9
          keep_files: true

  sbtScripted:
    name: sbt scripted
    strategy:
      matrix:
        os: [ubuntu-22.04]
        scala: [3.3.8]
        java: [corretto@17, corretto@21]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (corretto@17)
        id: setup-java-corretto-17
        if: matrix.java == 'corretto@17'
