        with:
          distribution: corretto
          java-version: 17
          cache: sbt

      - name: sbt update
        if: matrix.java == 'corretto@17' && steps.setup-java-corretto-17.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Setup Java (corretto@21)
        id: setup-java-corretto-21
        if: matrix.java == 'corretto@21'
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
          cache: sbt

      - name: sbt update
        if: matrix.java == 'corretto@21' && steps.setup-java-corretto-21.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Setup Java (corretto@25)
        id: setup-java-corretto-25
        if: matrix.java == 'corretto@25'
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'corretto@25' && steps.setup-java-corretto-25.outputs.cache-hit == 'false'
        run: sbt +update

      - name: sbt publishLocal
        run: sbt +publishLocal

      - name: sbt scripted
        run: sbt scripted

  coverage:
    name: Generate coverage report
    strategy:
      matrix:
        os: [ubuntu-22.04]
        scala: [3.3.8, 3.8.4]
        java: [corretto@25]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (fast)
        uses: actions/checkout@v6

      - name: Start up MySQL on Docker
        run: docker compose up -d

      - name: Setup Java (corretto@25)
        id: setup-java-corretto-25
        if: matrix.java == 'corretto@25'
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'corretto@25' && steps.setup-java-corretto-25.outputs.cache-hit == 'false'
        run: sbt +update

      - run: sbt '++ ${{ matrix.scala }}' coverage ldbcJVM/test coverageAggregate

      - name: Stop MySQL on Docker
        run: docker compose down

      - env:
          CODECOV_TOKEN: ${{secrets.CODECOV_TOKEN}}
        uses: codecov/codecov-action@v4
        with:
          flags: ${{matrix.scala}}
